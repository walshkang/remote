[project]
name = "remote"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography<46",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pylitterbot>=2025.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
