services:
  remote:
    build: .
    container_name: remote
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TZ=America/New_York
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: remote-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-remote.walshkang.com}
      - HOME_IP=${HOME_IP:-71.190.248.179}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - remote

volumes:
  caddy_data:
  caddy_config:
